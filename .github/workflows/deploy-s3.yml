name: Deploy Web UI to S3

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-web-ui
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      S3_BUCKET: www.fitpulsebot.fit
      CLOUDFRONT_DISTRIBUTION_ID: E14J5EJG880PK6
      CI: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed static assets
        run: |
          aws s3 sync build/static "s3://${S3_BUCKET}/static" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload app shell and public files
        run: |
          aws s3 sync build "s3://${S3_BUCKET}" \
            --delete \
            --exclude "static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

